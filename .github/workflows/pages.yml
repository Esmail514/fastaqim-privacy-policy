name: Publish privacy policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-policy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build static pages
        run: node scripts/build.mjs

      - name: Check static pages
        run: node scripts/check.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Arabic and English pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$PAGE_URL" -o "$RUNNER_TEMP/privacy-ar.html"
          grep -q 'سياسة بيانات المستخدمين' "$RUNNER_TEMP/privacy-ar.html"
          curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "${PAGE_URL}en/" -o "$RUNNER_TEMP/privacy-en.html"
          grep -q 'User data policy' "$RUNNER_TEMP/privacy-en.html"
          curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "${PAGE_URL}styles.css" -o /dev/null
          curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "${PAGE_URL}assets/logo.png" -o /dev/null
